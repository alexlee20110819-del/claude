[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path serves the same document.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    # No external scripts, styles, or fonts — the page is self-contained.
    # `connect-src` additionally allows docs.google.com so live sheet sync can
    # fetch a published CSV. That is the only outbound destination permitted;
    # lead data is still never sent anywhere, only read.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
